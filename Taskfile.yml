version: '3'

vars:
  WEBADMIN: applications/web-admin
  WEBCUSTOMERS: applications/web-customers
  WEBPROVIDERS: applications/web-providers

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  install: 
    desc: Install dependencies for all projects
    cmds:
      - task: install-webadmin
      - task: install-webcustomers
      - task: install-webproviders

  install-webadmin:
    internal: true
    dir: '{{.WEBADMIN}}'
    cmds: [pnpm install]

  install-webproviders:
    internal: true
    dir: '{{.WEBPROVIDERS}}'
    cmds: [pnpm install]

  install-webcustomers:
    internal: true
    dir: '{{.WEBCUSTOMERS}}'
    cmds: [pnpm install]

  dev:
    desc: Run all three app in parallet (Ctrl+C stops all)
    deps: [dev-webadmin, dev-webproviders, dev-webcustomers]
  
  dev-webadmin:
    desc: Run web-admin on :3005
    dir: '{{.WEBADMIN}}'
    cmds: [pnpm dev]

  dev-webproviders:
    desc: Run web-providers on :3011
    dir: '{{.WEBPROVIDERS}}'
    cmds: [pnpm dev]

  dev-webcustomers:
    desc: Run web-customers on :3001
    dir: '{{.WEBCUSTOMERS}}'
    cmds: [pnpm dev]

  build:
    desc: Build Everything
    deps: [build-webadmin, build-webproviders, build-webcustomers]

  build-webadmin:
    desc: Build webadmin
    dir: '{{.WEBADMIN}}'
    cmds: [pnpm build]

  build-webproviders:
    desc: Build webproviders
    dir: '{{.WEBPROVIDERS}}'
    cmds: [pnpm build]

  build-webcustomers:
    desc: Build webcustomers
    dir: '{{.WEBCUSTOMERS}}'
    cmds: [pnpm build]
  
  lint:
    desc: Lint all web apps
    deps: [lint-webadmin, lint-webproviders, lint-webcustomers]

  lint-webadmin:
    desc: Lint webadmin
    dir: '{{.WEBADMIN}}'
    cmds: [pnpm lint]

  lint-webproviders:
    desc: Lint admin
    dir: '{{.WEBPROVIDERS}}'
    cmds: [pnpm lint]

  lint-webcustomers:
    desc: Lint admin
    dir: '{{.WEBCUSTOMERS}}'
    cmds: [pnpm lint]

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: rm -rf {{.WEBADMIN}}/.next {{.WEBPROVIDERS}}/.next {{.WEBCUSTOMERS}}/.next
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.WEBADMIN}}/.next {{.WEBPROVIDERS}}/.next {{.WEBCUSTOMERS}}/.next"
        platforms: [windows]