version: '3'

output: prefixed

vars:
  WEBADMIN: applications/web-admin
  WEBCUSTOMERS: applications/web-customers
  WEBPROVIDERS: applications/web-providers
  UI: packages/ui-package
  THEME: '{{.THEME | default "light"}}'

env:
  NEXT_PUBLIC_THEME: light

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies for the whole workspace
    cmds: [pnpm install]

  dev:
    desc: Run all three app in parallet (Ctrl+C stops all)
    deps: [dev-webadmin, dev-webproviders, dev-webcustomers]
  
  dev-webadmin:
    desc: Run web-admin on :3005
    dir: '{{.WEBADMIN}}'
    prefix: admin
    cmds: [pnpm dev]

  dev-webproviders:
    desc: Run web-providers on :3011
    dir: '{{.WEBPROVIDERS}}'
    prefix: providers
    cmds: [pnpm dev]

  dev-webcustomers:
    desc: Run web-customers on :3001
    dir: '{{.WEBCUSTOMERS}}'
    prefix: customers
    cmds: [pnpm dev]

  build:
    desc: Build Everything
    deps: [build-webadmin, build-webproviders, build-webcustomers]

  build-webadmin:
    desc: Build webadmin
    dir: '{{.WEBADMIN}}'
    prefix: admin
    cmds: [pnpm build]

  build-webproviders:
    desc: Build webproviders
    dir: '{{.WEBPROVIDERS}}'
    prefix: providers
    cmds: [pnpm build]

  build-webcustomers:
    desc: Build webcustomers
    dir: '{{.WEBCUSTOMERS}}'
    prefix: customers
    cmds: [pnpm build]

  start:
    desc: Run the production builds of all three apps (run `task build` first)
    deps: [start-webadmin, start-webproviders, start-webcustomers]

  start-webadmin:
    internal: true
    dir: '{{.WEBADMIN}}'
    prefix: admin
    cmds: [pnpm start -p 3005]

  start-webproviders:
    internal: true
    dir: '{{.WEBPROVIDERS}}'
    prefix: providers
    cmds: [pnpm start -p 3011]

  start-webcustomers:
    internal: true
    dir: '{{.WEBCUSTOMERS}}'
    prefix: customers
    cmds: [pnpm start -p 3001]
  
  lint:
    desc: Lint all three apps
    deps: [lint-webadmin, lint-webproviders, lint-webcustomers]

  lint-webadmin:
    desc: Lint web-admin
    dir: '{{.WEBADMIN}}'
    prefix: admin
    cmds: [pnpm lint]

  lint-webproviders:
    desc: Lint web-providers
    dir: '{{.WEBPROVIDERS}}'
    prefix: providers
    cmds: [pnpm lint]

  lint-webcustomers:
    desc: Lint web-customers
    dir: '{{.WEBCUSTOMERS}}'
    prefix: customers
    cmds: [pnpm lint]

  typecheck:
    desc: Type-check all apps and packages
    cmds: [pnpm -r exec tsc --noEmit]

  check:
    desc: Lint and type-check everything
    deps: [lint, typecheck]

  add:
    desc: "Add a package to one app: task add APP=web-customers PKG=zod [DEV=1]"
    requires:
      vars: [APP, PKG]
    cmds:
      - pnpm --filter {{.APP}} add {{if .DEV}}-D {{end}}{{.PKG}}

  clean:
    desc: Remove build outputs
    cmds:
      - cmd: rm -rf {{.WEBADMIN}}/.next {{.WEBPROVIDERS}}/.next {{.WEBCUSTOMERS}}/.next
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.WEBADMIN}}/.next, {{.WEBPROVIDERS}}/.next, {{.WEBCUSTOMERS}}/.next"
        platforms: [windows]